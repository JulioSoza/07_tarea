<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Edad en Años de Tortuga</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Calculadora de Edad en Años de Tortuga 🐢</h1>
    <img src="images.jpg" alt="Tortuga" class="turtle-image">
    
    <label for="turtleAge">Ingresa la edad de tu tortuga (en años reales):</label>
    <input type="number" id="turtleAge" placeholder="Edad de la tortuga">
    
    <button id="calculateButton">Calcular Edad Humana</button>
    
    <div id="output">
      <p id="result"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
